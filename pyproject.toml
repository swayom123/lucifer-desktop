[project]
name = "lucifer-desktop"
version = "0.1.0"
requires-python = ">=3.12"
description = "Local, permission-aware desktop assistant"
readme = "README.md"
dependencies = [
    "PySide6>=6.8,<7",
    "python-dotenv>=1.0,<2",
    "psutil>=6,<8",
    "mss>=10,<11",
    "dbus-next>=0.2.3,<0.3; sys_platform == 'linux'",
    "playwright>=1.50,<2",
    "ddgs>=9,<10",
    "aiohttp>=3.10,<4",
    "livekit-agents>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]
voice = ["faster-whisper>=1.2,<2", "numpy>=2,<3", "av>=14,<19"]

[project.scripts]
lucifer = "main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "automation*", "config*", "core*", "database*", "services*", "tools*", "ui*", "voice*"]
exclude = ["tests*", "scripts*", "graphify-out*"]

[tool.setuptools.package-data]
config = ["permissions.json"]
ui = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
